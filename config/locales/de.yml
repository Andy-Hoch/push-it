  rules:
    title: So wird Push It gespielt
    goal: Wer am Ende einer Runde als Erster mindestens 200 Punkte hat, gewinnt – bei Gleichstand an der Spitze geht es weiter. Jede Runde teilt der Dealer jedem eine offene Karte aus, dann entscheidet reihum jeder, ob er noch eine Karte zieht oder stehen bleibt.
    turn_title: Ziehen oder stehen bleiben
    turn: Zieh so viele Karten wie du willst. Bleibst du stehen, sicherst du deine Punkte für diese Runde. Ohne Karte vor dir musst du ziehen.
    bust_title: Bust!
    bust: Ziehst du eine Zahl, die du schon hast, bist du raus und bekommst in dieser Runde 0 Punkte – auch Bonuskarten helfen dann nicht.
    jackpot_title: Jackpot
    jackpot: Sieben verschiedene Zahlen (die 0 zählt mit) beenden die Runde sofort und bringen 15 Bonuspunkte. Alle anderen werten ihre Karten.
    scoring_title: Wertung
    scoring: Zahlen addieren, mit ×2 verdoppeln (nur die Zahlen), dann +2 bis +10 dazu, dann +15 für den Jackpot.
    deck_title: Das Deck
    deck: "94 Karten: einmal die 0 und die 1, zweimal die 2 … zwölfmal die 12, dazu +2, +4, +6, +8, +10, ×2 und je drei Freeze, Dreierlei und Second Chance. Zwischen den Runden wird nicht gemischt."
    cards:
      freeze: Gib sie einem aktiven Spieler (auch dir selbst) – er sichert sofort seine Punkte und ist für die Runde raus.
      triple: Der gewählte Spieler muss drei Karten nacheinander aufdecken. Dabei gezogene Freeze- und Dreierlei-Karten werden erst danach gespielt.
      chance: Schützt einmal vor einer doppelten Zahl – beide Karten werden abgeworfen. Du darfst nur eine haben, eine zweite musst du weitergeben.
      mx2: Verdoppelt die Summe deiner Zahlenkarten. Die anderen Bonuskarten werden danach addiert.


name: Release

# Läuft, sobald die CI für einen Push auf main (also jeden Merge) grün ist:
# baut das Docker-Image, legt es in der GitHub Container Registry ab und
# erstellt einen Release-Entwurf. Veröffentlicht wird der Entwurf von Hand.
# Beim Veröffentlichen bekommt das Image zusätzlich den Tag `latest`.

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  release:
    types: [ published ]

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  package:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine version
        id: version
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          version="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/$(echo "$REPOSITORY" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          notes=$(printf 'Docker-Image:\n\n```\ndocker pull %s:%s\n```\n' "$IMAGE" "$VERSION")

          gh release create "$VERSION" \
            --draft \
            --target "$SHA" \
            --title "$VERSION" \
            --notes "$notes" \
            --generate-notes

  tag-latest:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag released image as latest
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          image="${REGISTRY}/$(echo "$REPOSITORY" | tr "[:upper:]" "[:lower:]")"
          docker buildx imagetools create --tag "${image}:latest" "${image}:${VERSION}"
